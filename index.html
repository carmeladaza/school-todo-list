<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Hub | Personal Todo</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-pink: #ffb7c5;
            --soft-pink: #ffe4e8;
            --accent-color: #ff85a2;
            --text-dark: #5a5a5a;
            --bg-gradient: linear-gradient(135deg, #fff5f7 0%, #f0f4ff 100%);
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-dark);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* The "Glass" Card */
        .todo-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(255, 183, 197, 0.2);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h2 { 
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            flex: 1;
            padding: 15px;
            border: none;
            background: white;
            border-radius: 15px;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            font-family: 'Poppins', sans-serif;
            transition: 0.3s;
        }

        input:focus {
            box-shadow: 0 0 0 2px var(--primary-pink);
        }

        button#add-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button#add-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 133, 162, 0.4);
        }

        ul {
            padding: 0;
            margin: 0;
            list-style: none;
        }

        li {
            background: white;
            margin-bottom: 12px;
            padding: 15px 20px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.4s ease forwards;
            border-left: 5px solid var(--primary-pink);
        }

        .task-text {
            font-size: 0.95rem;
            color: #666;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ffcad4;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.3s;
        }

        .delete-btn:hover {
            color: #ff4d6d;
        }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        ::placeholder { color: #ccc; }
    </style>
</head>
<body>

    <div class="todo-card">
        <h2>🌸 My School Vibe</h2>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button id="add-btn" onclick="addTask()">+</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');

        let tasks = JSON.parse(localStorage.getItem('vibe_tasks')) || [];

        function renderTasks() {
            taskList.innerHTML = '';
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span class="task-text">${task}</span>
                    <button class="delete-btn" onclick="removeTask(${index})">✦</button>
                `;
                taskList.appendChild(li);
            });
            localStorage.setItem('vibe_tasks', JSON.stringify(tasks));
        }

        function addTask() {
            const val = taskInput.value.trim();
            if (val !== "") {
                tasks.push(val);
                taskInput.value = '';
                renderTasks();
            }
        }

        function removeTask(index) {
            const items = document.querySelectorAll('li');
            items[index].style.opacity = '0';
            setTimeout(() => {
                tasks.splice(index, 1);
                renderTasks();
            }, 300);
        }

        taskInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") addTask();
        });

        // Initial Load
        renderTasks();
    </script>

</body>
</html>
