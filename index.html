<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Workspace | CCIS Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff85a2;
            --bg: #fff5f7;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text: #4a4a4a;
            --danger: #ff4d6d;
            --warning: #ffd166;
            --low: #06d6a0;
        }

        body.dark-mode {
            --bg: #1a1a2e;
            --card-bg: rgba(30, 30, 50, 0.95);
            --text: #e0e0e0;
            --primary: #ff9fb6;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.4s;
            min-height: 100vh;
        }

        button#add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: 0.3s;
            font-size: 1rem;
        }
        button#add-btn:hover { transform: translateY(-2px); opacity: 0.9; }

        /* Nav Bar */
        .nav-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        .icon-btn {
            background: var(--card-bg);
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            padding: 10px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        /* Settings Sidebar */
        .settings-panel {
            position: fixed;
            right: -400px;
            top: 0;
            width: 300px;
            height: 100%;
            background: var(--card-bg);
            box-shadow: -10px 0 30px rgba(0,0,0,0.1);
            transition: 0.5s;
            padding: 30px;
            z-index: 999;
            overflow-y: auto;
        }

        .settings-panel.open { right: 0; }

        /* Workspace Tabs */
        .workspace-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            margin-top: 60px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab {
            padding: 8px 18px;
            border-radius: 15px;
            cursor: pointer;
            background: var(--card-bg);
            border: 2px solid transparent;
            font-weight: 600;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .tab.active { border-color: var(--primary); color: var(--primary); }

        /* Motivation Section */
        .header { text-align: center; margin-bottom: 20px; }
        #motivation-quote { font-style: italic; font-size: 0.85rem; opacity: 0.8; margin-top: 5px; color: var(--primary); min-height: 1.2em; }

        /* Input Card */
        .input-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 25px;
            width: 100%;
            max-width: 650px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .input-row { display: flex; gap: 10px; margin-bottom: 12px; }
        input, select { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.05); background: var(--bg); color: var(--text); font-family: 'Poppins'; }

        /* Subjects Grid */
        .subjects-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }

        .subject-box {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 20px;
            border-top: 10px solid var(--primary);
            animation: fadeIn 0.4s ease;
        }

        .progress-container { height: 6px; background: rgba(0,0,0,0.05); border-radius: 10px; margin-bottom: 15px; overflow: hidden; }
        .progress-bar { height: 100%; transition: 0.5s; }

        .task-item {
            background: var(--bg);
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-left: 5px solid transparent;
            transition: 0.3s;
        }

        .priority-High { border-left-color: var(--danger); }
        .priority-Medium { border-left-color: var(--warning); }
        .priority-Low { border-left-color: var(--low); }

        .status-circle {
            width: 20px; height: 20px; border: 2.5px solid var(--primary);
            border-radius: 50%; flex-shrink: 0; margin-left: 10px; display: flex; align-items: center; justify-content: center;
        }

        .task-item.completed { opacity: 0.5; text-decoration: line-through; filter: grayscale(1); }
        .task-item.completed .status-circle { background: var(--primary); color: white; font-size: 10px; }

        .overdue-badge { background: var(--danger); color: white; font-size: 0.6rem; padding: 2px 6px; border-radius: 5px; margin-left: 5px; }

        .archive-item { font-size: 0.8rem; padding: 10px; border-bottom: 1px solid rgba(0,0,0,0.05); }

        .empty-state {
            text-align: center;
            grid-column: 1 / -1; /* Sinisigurado nito na sakop niya buong width ng grid */
            padding: 100px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0.8;
            animation: fadeIn 0.8s ease;
        }

        .empty-state h3 {
            margin-top: 15px;
            font-size: 1.2rem;
            color: var(--primary);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="nav-bar">
        <button class="icon-btn" onclick="toggleDarkMode()">🌙</button>
        <button class="icon-btn" onclick="toggleSettings()">⚙️</button>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <h2 style="color:var(--primary)">Settings</h2>
        <hr style="opacity:0.2">
        <h3>📜 History / Archive</h3>
        <div id="archiveList">No history yet.</div>
        <br>
        <button onclick="clearArchive()" style="background:var(--primary); color:white; border:none; padding:12px; border-radius:12px; width:100%; cursor:pointer; font-weight:600;">Clear History</button>
    </div>

    <div class="header">
        <h2>🌸 Ultimate Workspace</h2>
        <div id="motivation-quote">"Loading inspiration..."</div>
    </div>

    <div class="workspace-tabs" id="workspaceTabs">
        <div class="tab active" onclick="switchWorkspace('Acads')">Acads</div>
        <div class="tab" onclick="switchWorkspace('Personal')">Personal</div>
        <div class="tab" onclick="switchWorkspace('Hobbies')">Hobbies</div>
    </div>

    <div class="input-card">
        <div class="input-row">
            <input type="text" id="taskName" placeholder="Task Name">
            <input type="text" id="subjectName" placeholder="Subject (e.g. Calculus)">
        </div>
        <div class="input-row">
            <input type="date" id="deadline">
            <select id="priority">
                <option value="Low">Low Priority</option>
                <option value="Medium" selected>Medium Priority</option>
                <option value="High">High Priority</option>
            </select>
            <input type="color" id="subjectColor" value="#ff85a2" title="Pick Subject Color" style="flex:0.2; height:48px; border-radius:10px; cursor:pointer;">
        </div>
        <button id="add-btn" onclick="addTask()" style="width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:15px; font-weight:600; cursor:pointer; font-size:1rem;">Add to List</button>
    </div>

    <div id="subjectsContainer" class="subjects-container"></div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('mega_tasks_v3')) || [];
        let archive = JSON.parse(localStorage.getItem('mega_archive_v3')) || [];
        let currentWorkspace = 'Acads';
        let subjectColors = JSON.parse(localStorage.getItem('mega_colors_v3')) || {};

        const quotes = [
            "Kaya mo 'yan, CCIS represent! 🌸",
            "Future Software Developer in the making! 💻",
            "One code at a time, one task at a time.",
            "Mag-pahinga pero 'wag susuko. ✨",
            "Trust your logic, trust your process.",
            "Aesthetic and productive? That's you! 💅",
            "Girl you can't be broke and dumb at the same time! 😎",
            "LOCK THE FUCK IN",
            "sabi nga ng ben&ben, pag mahal mo na, wala na tayong magagawa jan"
        ];

        function toggleDarkMode() {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('mega_theme', isDark ? 'dark' : 'light');
        }

        if (localStorage.getItem('mega_theme') === 'dark') document.body.classList.add('dark-mode');

        function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('open'); }

        function setRandomQuote() {
            document.getElementById('motivation-quote').innerText = `"${quotes[Math.floor(Math.random() * quotes.length)]}"`;
        }

        function switchWorkspace(ws) {
            currentWorkspace = ws;
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.innerText === ws));
            render();
        }

        function addTask() {
            const name = document.getElementById('taskName').value;
            const subject = document.getElementById('subjectName').value || "General";
            const date = document.getElementById('deadline').value;
            const priority = document.getElementById('priority').value;
            const color = document.getElementById('subjectColor').value;

            if (!name) return;

            subjectColors[subject] = color;
            tasks.push({ id: Date.now(), name, subject, date, priority, workspace: currentWorkspace, done: false });

            document.getElementById('taskName').value = '';
            document.getElementById('subjectName').value = '';
            document.getElementById('deadline').value = '';
            localStorage.setItem('mega_colors_v3', JSON.stringify(subjectColors));
            render();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) task.done = !task.done;

            // Auto-archive if subject is finished
            const subTasks = tasks.filter(t => t.subject === task.subject && t.workspace === task.workspace);
            if (subTasks.every(t => t.done)) {
                archive.push(...subTasks);
                tasks = tasks.filter(t => t.subject !== task.subject || t.workspace !== task.workspace);
            }
            render();
        }

        function clearArchive() { archive = []; render(); }

        function isOverdue(dateString) {
            if (!dateString) return false;
            const today = new Date(); today.setHours(0,0,0,0);
            return new Date(dateString) < today;
        }

        function render() {
            const container = document.getElementById('subjectsContainer');
            const archiveCont = document.getElementById('archiveList');
            container.innerHTML = '';
            setRandomQuote();
            
            // Archive Render
            archiveCont.innerHTML = archive.length ? archive.map(a => `<div class="archive-item">✅ ${a.name} <small>(${a.subject})</small></div>`).reverse().join('') : "No history yet.";

            // Filter & Sort Logic
            const wsTasks = tasks.filter(t => t.workspace === currentWorkspace);
            const pMap = { "High": 1, "Medium": 2, "Low": 3 };

            if (wsTasks.length === 0) {
                container.innerHTML = `<div class="empty-state"><h3>✨ All clear in ${currentWorkspace}! Time for a break! 🌸</h3></div>`;
            } else {
                const groups = wsTasks.reduce((acc, t) => {
                    if (!acc[t.subject]) acc[t.subject] = [];
                    acc[t.subject].push(t);
                    return acc;
                }, {});

                for (const sub in groups) {
                    groups[sub].sort((a, b) => {
                        if (a.done !== b.done) return a.done ? 1 : -1;
                        return pMap[a.priority] - pMap[b.priority];
                    });

                    const doneCount = groups[sub].filter(t => t.done).length;
                    const totalCount = groups[sub].length;
                    const subColor = subjectColors[sub] || 'var(--primary)';

                    const box = document.createElement('div');
                    box.className = 'subject-box';
                    box.style.borderColor = subColor;
                    
                    box.innerHTML = `
                        <h3 style="color:${subColor}">${sub} <span>${doneCount}/${totalCount}</span></h3>
                        <div class="progress-container">
                            <div class="progress-bar" style="width:${(doneCount/totalCount)*100}%; background:${subColor}"></div>
                        </div>
                        ${groups[sub].map(t => `
                            <div class="task-item priority-${t.priority} ${t.done ? 'completed' : ''}" onclick="toggleTask(${t.id})">
                                <div class="task-info">
                                    <strong>${t.name} ${(!t.done && isOverdue(t.date)) ? '<span class="overdue-badge">Overdue!</span>' : ''}</strong>
                                    <small>${t.date ? '📅 ' + t.date : 'No deadline'} | ${t.priority}</small>
                                </div>
                                <div class="status-circle" style="border-color:${subColor}">${t.done ? '✓' : ''}</div>
                            </div>
                        `).join('')}
                    `;
                    container.appendChild(box);
                }
            }

            localStorage.setItem('mega_tasks_v3', JSON.stringify(tasks));
            localStorage.setItem('mega_archive_v3', JSON.stringify(archive));
        }

        render();
    </script>
</body>
</html>
