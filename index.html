<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Hub Pro | Elite Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff85a2;
            --bg: #fff5f7;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text: #4a4a4a;
            --danger: #ff4d6d;
            --warning: #ffd166;
            --low: #06d6a0;
        }

        body.dark-mode {
            --bg: #1a1a2e;
            --card-bg: rgba(30, 30, 50, 0.95);
            --text: #e0e0e0;
            --primary: #ff9fb6;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            padding: 40px 20px;
            transition: 0.4s;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .theme-toggle { position: fixed; top: 20px; right: 20px; cursor: pointer; font-size: 1.5rem; background: none; border: none; z-index: 100;}

        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { color: var(--primary); margin-bottom: 5px; }
        #motivation-quote { font-style: italic; font-size: 0.85rem; opacity: 0.8; margin-bottom: 20px; color: var(--primary); }

        .input-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 650px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
        }

        .input-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
        input, select {
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.05);
            background: var(--bg);
            color: var(--text);
            outline: none;
            flex: 1;
            font-family: 'Poppins', sans-serif;
        }

        button#add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: 0.3s;
            font-size: 1rem;
        }
        button#add-btn:hover { transform: translateY(-2px); opacity: 0.9; }

        .subjects-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }

        .subject-box {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.03);
            border-top: 10px solid var(--primary);
            height: fit-content;
            position: relative;
        }

        .progress-container {
            height: 6px;
            background: rgba(0,0,0,0.05);
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .progress-bar { height: 100%; background: var(--primary); transition: 0.5s; }

        .subject-box h3 { display: flex; justify-content: space-between; align-items: center; color: var(--primary); margin: 0 0 5px 0; }
        .subject-box h3 span { font-size: 0.75rem; opacity: 0.7; }

        .task-item {
            background: var(--bg);
            margin-bottom: 12px;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-left: 6px solid transparent;
            transition: 0.3s;
        }

        .priority-High { border-left-color: var(--danger); }
        .priority-Medium { border-left-color: var(--warning); }
        .priority-Low { border-left-color: var(--low); }

        .status-circle {
            width: 20px; height: 20px; border: 2.5px solid var(--primary);
            border-radius: 50%; flex-shrink: 0; margin-left: 10px; display: flex; align-items: center; justify-content: center;
        }

        .task-item.completed { opacity: 0.5; text-decoration: line-through; filter: grayscale(1); }
        .task-item.completed .status-circle { background: var(--primary); color: white; font-size: 10px; }

        .overdue-badge {
            background: var(--danger); color: white; font-size: 0.6rem; padding: 2px 6px; border-radius: 5px; margin-left: 5px;
        }

        .empty-state { text-align: center; grid-column: 1 / -1; padding: 60px; }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleDarkMode()">🌙</button>

    <div class="header">
        <h2>🌸 School Productivity Hub</h2>
        <div id="motivation-quote">"One code at a time, future dev!"</div>
    </div>

    <div class="input-card">
        <div class="input-row">
            <input type="text" id="taskName" placeholder="Task Name">
            <input type="text" id="subjectName" placeholder="Subject (e.g. Calculus)">
        </div>
        <div class="input-row">
            <input type="date" id="deadline">
            <select id="priority">
                <option value="Low">Low Priority</option>
                <option value="Medium" selected>Medium Priority</option>
                <option value="High">High Priority</option>
            </select>
        </div>
        <button id="add-btn" onclick="addTask()">Add Task</button>
    </div>

    <div id="subjectsContainer" class="subjects-container"></div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('vibe_elite_tasks')) || [];
        
        const quotes = [
            "Kaya mo 'yan, CCIS represent! 🌸",
            "Future Software Developer in the making! 💻",
            "One step at a time, one task at a time.",
            "Mag-pahinga pero 'wag susuko. ✨",
            "Believe in your logic, trust your process.",
            "Aesthetic and productive? That's you! 💅",
            "Girl you can't be broke and dumb at the same time! 😎",
            "LOCK THE FUCK IN",
            "sabi nga ng ben&ben, pag mahal mo na, wala na tayong magagawa jan"
        ];

        function toggleDarkMode() {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.querySelector('.theme-toggle').innerText = isDark ? '☀️' : '🌙';
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.querySelector('.theme-toggle').innerText = '☀️';
        }

        function setRandomQuote() {
            const quoteElem = document.getElementById('motivation-quote');
            quoteElem.innerText = `"${quotes[Math.floor(Math.random() * quotes.length)]}"`;
        }

        function addTask() {
            const name = document.getElementById('taskName').value;
            const subject = document.getElementById('subjectName').value || "General";
            const date = document.getElementById('deadline').value;
            const priority = document.getElementById('priority').value;

            if (!name) return;

            tasks.push({
                id: Date.now(),
                name,
                subject,
                date,
                priority,
                done: false,
                initial: true // Flag to track original tasks for stats
            });

            document.getElementById('taskName').value = '';
            document.getElementById('subjectName').value = '';
            document.getElementById('deadline').value = '';
            render();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) task.done = !task.done;
            
            // Logic: Auto-remove only if EVERYTHING in subject is done
            const subjectTasks = tasks.filter(t => t.subject === task.subject);
            if (subjectTasks.every(t => t.done)) {
                tasks = tasks.filter(t => t.subject !== task.subject);
            }
            render();
        }

        function isOverdue(dateString) {
            if (!dateString) return false;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return new Date(dateString) < today;
        }

        function render() {
            const container = document.getElementById('subjectsContainer');
            container.innerHTML = '';
            setRandomQuote();

            if (tasks.length === 0) {
                container.innerHTML = `<div class="empty-state"><h3>✨ All clear! Enjoy your break! 🌸</h3></div>`;
                localStorage.setItem('vibe_elite_tasks', JSON.stringify(tasks));
                return;
            }

            const groups = tasks.reduce((acc, task) => {
                if (!acc[task.subject]) acc[task.subject] = [];
                acc[task.subject].push(task);
                return acc;
            }, {});

            const pMap = { "High": 1, "Medium": 2, "Low": 3 };

            for (const subject in groups) {
                // ETO YUNG MULTI-LEVEL SORTING
                groups[subject].sort((a, b) => {
                    if (a.done !== b.done) return a.done ? 1 : -1;
                    return pMap[a.priority] - pMap[b.priority];
                });

                const doneCount = groups[subject].filter(t => t.done).length;
                const totalCount = groups[subject].length;
                const progress = (doneCount / totalCount) * 100;

                const box = document.createElement('div');
                box.className = 'subject-box';
                const colors = ['#ff85a2', '#a2d2ff', '#c8b6ff', '#ffd6a5'];
                box.style.borderColor = colors[Math.abs(subject.length) % colors.length];

                box.innerHTML = `
                    <h3>${subject} <span>${doneCount}/${totalCount}</span></h3>
                    <div class="progress-container">
                        <div class="progress-bar" style="width: ${progress}%"></div>
                    </div>
                    <div>
                        ${groups[subject].map(task => {
                            const overdue = !task.done && isOverdue(task.date);
                            return `
                                <div class="task-item priority-${task.priority} ${task.done ? 'completed' : ''}" onclick="toggleTask(${task.id})">
                                    <div class="task-info">
                                        <strong>${task.name} ${overdue ? '<span class="overdue-badge">Overdue!</span>' : ''}</strong>
                                        <small>${task.date ? '📅 ' + task.date : 'No deadline'} | ${task.priority}</small>
                                    </div>
                                    <div class="status-circle">${task.done ? '✓' : ''}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                container.appendChild(box);
            }
            localStorage.setItem('vibe_elite_tasks', JSON.stringify(tasks));
        }

        render();
    </script>
</body>
</html>
